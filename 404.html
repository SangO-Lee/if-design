<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Redirecting...</title>
        <script type="text/javascript">
            // 현재 URL에서 pathname과 search를 가져와서 index.html로 리디렉트
            (function () {
                var l = window.location;
                var redirectUrl =
                    l.protocol +
                    "//" +
                    l.host +
                    "/?" +
                    "p=" +
                    l.pathname +
                    l.search +
                    l.hash;
                window.location.replace(redirectUrl);
            })();
        </script>
    </head>
    <body>
        <h1>페이지를 찾을 수 없습니다. Redirecting...</h1>
        <p>잠시만 기다려 주세요.</p>
    </body>
</html>
