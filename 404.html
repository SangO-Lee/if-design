<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Single Page Apps for GitHub Pages</title>
        <script type="text/javascript">
            var segmentCount = 1; // GitHub Pages에서 프로젝트 폴더 사용 시 1, Custom Domain 사용 시 0
            var l = window.location;

            // ✅ URL이 이미 변환된 상태라면 다시 변경하지 않도록 체크
            if (!l.search.includes("p=") && !l.search.includes("q=")) {
                l.replace(
                    l.protocol +
                        "//" +
                        l.hostname +
                        (l.port ? ":" + l.port : "") +
                        l.pathname
                            .split("/")
                            .slice(0, 1 + segmentCount)
                            .join("/") +
                        "/?p=/" +
                        l.pathname
                            .slice(1)
                            .split("/")
                            .slice(segmentCount)
                            .join("/")
                            .replace(/&/g, "~and~") +
                        (l.search
                            ? "&q=" + l.search.slice(1).replace(/&/g, "~and~")
                            : "") +
                        l.hash
                );
            }
        </script>
    </head>
    <body></body>
</html>
