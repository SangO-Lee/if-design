<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Single Page Apps for GitHub Pages</title>
        <script type="text/javascript">
            var segmentCount = 1;
            var l = window.location;

            // ✅ URL이 이미 변환된 상태이거나, 루트 경로라면 변경하지 않음
            if (!l.search.includes("p=") && l.pathname !== "/") {
                l.replace(
                    l.protocol +
                        "//" +
                        l.hostname +
                        (l.port ? ":" + l.port : "") +
                        l.pathname
                            .split("/")
                            .slice(0, 1 + segmentCount)
                            .join("/") +
                        (l.pathname === "/"
                            ? ""
                            : "/?p=" +
                              l.pathname
                                  .slice(1)
                                  .split("/")
                                  .slice(segmentCount)
                                  .join("/")
                                  .replace(/&/g, "~and~")) +
                        (l.search
                            ? "&q=" + l.search.slice(1).replace(/&/g, "~and~")
                            : "") +
                        l.hash
                );
            }
        </script>
    </head>
    <body></body>
</html>
