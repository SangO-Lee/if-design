        <!-- Google tag (gtag.js) -->
        <script

            src="https://www.googletagmanager.com/gtag/js?id=G-FPSRHMY0NH"

        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-FPSRHMY0NH");

        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <title>CREVERSE Integrated Academy AI Management Service</title>
        <script type="text/javascript">
            (function (l) {
                if (l.search) {
                    var q = {};
                    l.search
                        .slice(1)
                        .split("&")
                        .forEach(function (v) {
                            var a = v.split("=");
                            q[a[0]] = a
                                .slice(1)
                                .join("=")
                                .replace(/~and~/g, "&");
                        });
                    if (q.p !== undefined) {
                        window.history.replaceState(
                            null,
                            null,
                            l.pathname.slice(0, -1) +
                                (q.p || "") +
                                (q.q ? "?" + q.q : "") +
                                l.hash
                        );
                    }
                }
            })(window.location);
        </script>
    </head>

    <body id="body-layout">
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
